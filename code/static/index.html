<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Real-Time Voice Chat</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:400,500,600&display=swap">

  <style>
    :root {
      --primary: #1f2937;
      --accent: #ff8a3d;
      --bg: #f6f8fb;
      --border: #e5e7eb;
      --text-muted: #6b7280;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont;
      background:
        radial-gradient(circle at top left, rgba(255,138,61,0.10), transparent 45%),
        radial-gradient(circle at bottom right, rgba(255,193,140,0.12), transparent 50%),
        #f6f8fb;
      color: #111827;
    }

    #app {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 100vh;
    }

    /* ================= LEFT PANEL ================= */

    .left-panel {
      padding: 56px 64px;
      display: flex;
      flex-direction: column;
      gap: 32px;
      background: linear-gradient(180deg, #ffffff, #f7f9fc);
      border-right: 1px solid var(--border);
    }

    .header-section h1 {
      font-size: 26px;
      font-weight: 600;
      margin: 0;
      letter-spacing: -0.02em;
    }

    .header-section p {
      margin-top: 6px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .prompt-section {
      flex: none;
    }

    .prompt-display {
      height: 60vh;
      max-height: 60vh;
      overflow-y: auto;

      background: #f1f3f5;
      border: 1px solid var(--border);
      border-radius: 16px;

      padding: 18px 20px 72px;
      line-height: 1.75;
      position: relative;
    }

    .prompt-header {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f1f3f5;
      padding-bottom: 12px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .prompt-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
    }

    #personaSelect {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 13px;
      background: white;
      cursor: pointer;
    }

    .prompt-display p {
      margin: 0 0 14px 0;
    }



    /* ================= RIGHT PANEL ================= */

    .chat-container {
      display: flex;
      flex-direction: column;
      background: transparent;
    }

    .header {
      background: #ffffff;
      border-bottom: 1px solid rgba(107, 107, 107, 0.25);
      padding: 20px 28px;

      display: flex;
      align-items: center;
      gap: 10px;

      font-weight: 500;
      color: #1f2937;
    }

    .status {
      margin-left: auto;
      font-size: 13px;
      color: var(--text-muted);
    }

    .messages {
      flex: 1;
      padding: 28px;
      background: var(--bg);
      overflow-y: auto;

      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .bubble {
      padding: 14px 18px;
      border-radius: 18px;
      max-width: 78%;
      font-size: 15px;
      line-height: 1.6;
    }

    .bubble.user {
      background: linear-gradient(135deg, #2b3a4a, #1f2a37);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 6px;
    }

    .bubble.assistant {
      background: white;
      color: #1f2937;
      border: 1px solid var(--border);
      align-self: flex-start;
      border-bottom-left-radius: 6px;
    }

    /* ================= INPUT BAR ================= */

    .input-bar {
      padding: 22px 28px;
      background: linear-gradient(180deg, #ffffff, #fff6ef);
      border-top: 1px solid rgba(94, 93, 93, 0.25);
    }

    .button-group {
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .btn {
      background: #f3f4f6;
      color: #111827;

      border: 1px solid var(--border);
      border-radius: 12px;

      padding: 10px 16px;
      font-size: 14px;
      font-weight: 500;

      cursor: pointer;
    }

    .btn svg {
      stroke: #111827;
    }

    .btn:hover:not(:disabled) {
      background: #e5e7eb;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }


    .logo-text {
      font-family: "Inter", "Segoe UI", "Helvetica Neue", sans-serif;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #000;
      margin-left: 8px;
      letter-spacing: 0.6px;
      }


    @media (max-width: 1024px) {
      #app {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
<div id="app">

  <!-- LEFT -->
  <div class="left-panel">
    <div class="header-section">
      <h1>Conversational Agents</h1>

      <p>Try out our collection of Customized voice agents specific to defined personas</p>
    </div>

    <div class="prompt-section">
      <div class="prompt-display" id="promptDisplay">

        <div class="prompt-header">
          <span class="prompt-title">System Prompt</span>
          <select id="personaSelect">
            <option value="ecommerce" selected>E-commerce Support</option>
            <option value="fitness">Fitness Coach</option>
            <option value="english">English Coach</option>
          </select>
        </div>

      <div id="promptContent">
      <p style="color:#9ca3af;font-style:italic">
        Select a persona to view the system prompt
      </p>
    </div>

      </div>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="chat-container">
    <div class="header">
    <img
      src="./assets/flower.svg"
      alt="Flower logo"
      width="22"
      height="22"
    />


      <div class="logo-text">VoiceArena</div>
      <span class="status" id="status"></span>
</div>


    <div class="messages" id="messages"></div>

<div class="input-bar">
  <div class="button-group">

    <!-- START / PLAY -->
    <button id="startBtn" class="btn" title="Start">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
           xmlns="http://www.w3.org/2000/svg">
        <polygon points="8,5 19,12 8,19"
                 stroke="currentColor"
                 stroke-width="2"
                 stroke-linejoin="round"
                 fill="none"/>
      </svg>
    </button>

    <!-- STOP -->
    <button id="stopBtn" class="btn" title="Stop">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
           xmlns="http://www.w3.org/2000/svg">
        <rect x="6" y="6" width="12" height="12"
              rx="2"
              stroke="currentColor"
              stroke-width="2"/>
      </svg>
    </button>

    <!-- CLEAR / RESET -->
    <button id="clearBtn" class="btn" title="Reset conversation">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
           xmlns="http://www.w3.org/2000/svg">
        <path d="M3 12a9 9 0 1 0 3-6.7"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"/>
        <path d="M3 4v5h5"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"/>
      </svg>
    </button>

    <!-- COPY -->
    <button id="copyBtn" class="btn" title="Copy conversation">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
           xmlns="http://www.w3.org/2000/svg">
        <rect x="9" y="9" width="11" height="11"
              rx="2"
              stroke="currentColor"
              stroke-width="2"/>
        <rect x="4" y="4" width="11" height="11"
              rx="2"
              stroke="currentColor"
              stroke-width="2"/>
      </svg>
    </button>

  </div>
</div>
    </div>
  </div>

</div>

<script>
  const personaPrompts = {
    
      ecommerce: `You are Kathy, a customer support agent at QuickKart, an e-commerce platform for electronics and home appliances.
        You handle order tracking, returns, refunds, and product inquiries.
        Be warm and solution-oriented. Acknowledge frustration before solving problems. Keep responses under 3 sentences.
        For refunds, explain the 5-7 business day timeline. For replacements, confirm the delivery address before proceeding
        If a customer is angry, apologize sincerely and offer a concrete next step. Never argue or make excuses.
        When a customer asks about an order, ask for their order ID if they haven't provided one. Accept any order ID they give and simulate looking it up.`,

      fitness: `You are Celine, an energetic fitness coach who motivates clients to reach their health goals.
      
        You provide workout advice, nutrition tips, and encouragement for people at all fitness levels.
        
        Be enthusiastic but not overwhelming. Celebrate small wins.
        
        Keep responses under 3 sentences. Always ask about any injuries or limitations before suggesting exercises.
        
        Encourage proper form over heavy weights. When someone seems discouraged, remind them that progress isn't linear.
        
        Share relatable stories of setbacks leading to breakthroughs. Focus on sustainable habits rather than quick fixes. Make fitness feel accessible and fun.`,
    
      english: `You are Trevor, a friendly English language coach who helps learners improve their communication skills.
      
        You assist with grammar, vocabulary, pronunciation, and conversation practice. Be patient and encouraging.
        
        Correct mistakes gently. Keep responses under 3 sentences. When correcting, always explain why and provide the correct version. Use simple language to explain complex grammar.
        
        If a learner makes the same mistake repeatedly, offer a memory trick or pattern to help them remember.
        
        Celebrate progress and build confidence. Make learning feel safe and judgment-free.`
      };

  const personaSelect = document.getElementById("personaSelect");
  const promptDisplay = document.getElementById("promptDisplay");

  personaSelect.addEventListener("change", function () {
    const value = this.value;

    if (!personaPrompts[value]) {
      promptContent.innerHTML = `
        <p style="color:#9ca3af;font-style:italic">
          Select a persona to view the system prompt
        </p>
      `;
      return;
    }

    promptContent.innerHTML = personaPrompts[value]
      .split("\n\n")
      .map(p => `<p>${p.trim()}</p>`)
      .join("");
  });

  personaSelect.dispatchEvent(new Event("change"))
</script>

<script src="/static/app.js"></script>
</body>
</html>
